[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-basics-vn"
version = "0.2.0"
description = "Basic AI knowledge for beginners, in Vietnamese — a curriculum plus from-scratch, dependency-free ML algorithms"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["machine-learning", "education", "vietnamese", "beginner", "from-scratch", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
aibasics = "aibasics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
